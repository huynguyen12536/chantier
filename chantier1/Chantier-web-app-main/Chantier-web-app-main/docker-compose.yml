version: '3.8'

services:
  web:
    image: ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-16035}:80"
    restart: unless-stopped
    environment:
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}
      - EXPO_PUBLIC_API_ANON_KEY=${EXPO_PUBLIC_API_ANON_KEY:-local-anon}
    healthcheck:
      # Use 127.0.0.1 — Alpine wget fails on localhost→::1 when nginx listens on IPv4 only
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
