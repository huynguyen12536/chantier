# Backend local stack (split-repo deploy): Postgres + Unified API + MinIO — NO FE
# Usage (from api-chantier/):
#   docker compose up -d --build
#
# Full monorepo stack (BE + FE) — Phase 13 overlay:
#   docker compose -f docker-compose.yml -f docker-compose.phase13.yml up -d --build
#
# API → http://localhost:${API_PORT:-3001}
# DB  → localhost:${POSTGRES_PORT:-5432}
# MinIO → localhost:${MINIO_PORT:-9000}
#
# On API start: auto-runs migrations (AUTO_MIGRATE=true).
# Optional: AUTO_SEED=true → scripts/seed-system-admin.js

services:
  db:
    image: postgres:16-alpine
    container_name: chantier-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chantier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chantier}
      POSTGRES_DB: ${POSTGRES_DB:-chantier}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chantier_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chantier} -d ${POSTGRES_DB:-chantier}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chantier-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      # phase13-style: live migrate/seed tools
      - ./migrations:/app/migrations:ro
      - ./scripts:/app/scripts:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-chantier}:${POSTGRES_PASSWORD:-chantier}@db:5432/${POSTGRES_DB:-chantier}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-chantier-assets}
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-localhost:9000}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:16035}
      SMTP_HOST: ${SMTP_HOST:-${MAIL_HOST:-}}
      SMTP_PORT: ${SMTP_PORT:-${MAIL_PORT:-587}}
      SMTP_USER: ${SMTP_USER:-${MAIL_USERNAME:-}}
      SMTP_PASS: ${SMTP_PASS:-${MAIL_PASSWORD:-}}
      SMTP_FROM: ${SMTP_FROM:-${MAIL_FROM_EMAIL:-noreply@chantier.local}}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-${MAIL_FROM_NAME:-ATN Chantier}}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ATN Chantier}
      OTP_SECRET: ${OTP_SECRET:-${JWT_SECRET:-change-me-in-production-use-long-random-string}}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_SEED: ${AUTO_SEED:-false}
    ports:
      - "${API_PORT:-3001}:3000"
    command: ["sh", "/app/scripts/docker-entrypoint.sh"]

  minio:
    image: minio/minio:latest
    container_name: chantier-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - chantier_minio_data:/data

volumes:
  chantier_pg_data:
  chantier_minio_data:
