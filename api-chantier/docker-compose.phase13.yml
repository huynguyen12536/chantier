# Phase 13 overlay — FE web on top of BE docker-compose.yml (monorepo local)
# Usage (from api-chantier/):
#   docker compose -f docker-compose.yml -f docker-compose.phase13.yml up -d --build
#
# FE → http://localhost:${WEB_PORT:-16035}
# API → http://localhost:${API_PORT:-3001}
# DB  → localhost:${POSTGRES_PORT:-5432}
#
# Split-repo deploy (no this file):
#   BE:  cd api-chantier && docker compose up -d --build
#   FE:  cd Chantier-web-app-main && docker compose -f docker-compose.local.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./migrations:/app/migrations:ro
      - ./scripts:/app/scripts:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-chantier}:${POSTGRES_PASSWORD:-chantier}@db:5432/${POSTGRES_DB:-chantier}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-chantier-assets}
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-localhost:9000}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:16035}
      SMTP_HOST: ${SMTP_HOST:-${MAIL_HOST:-}}
      SMTP_PORT: ${SMTP_PORT:-${MAIL_PORT:-587}}
      SMTP_USER: ${SMTP_USER:-${MAIL_USERNAME:-}}
      SMTP_PASS: ${SMTP_PASS:-${MAIL_PASSWORD:-}}
      SMTP_FROM: ${SMTP_FROM:-${MAIL_FROM_EMAIL:-noreply@chantier.local}}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-${MAIL_FROM_NAME:-ATN Chantier}}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ATN Chantier}
      OTP_SECRET: ${OTP_SECRET:-${JWT_SECRET:-change-me-in-production-use-long-random-string}}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_SEED: ${AUTO_SEED:-false}
    command: ["sh", "/app/scripts/docker-entrypoint.sh"]

  web:
    build:
      context: ../Chantier-web-app-main
      dockerfile: Dockerfile
      args:
        # Browser calls host-mapped API port (not docker DNS)
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3001}
        EXPO_PUBLIC_API_ANON_KEY: ${EXPO_PUBLIC_API_ANON_KEY:-local-anon}
    container_name: chantier-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-16035}:80"
    healthcheck:
      # DEF-P15-001 — wget localhost may resolve to ::1 (connection refused)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
